# Attestation policy (EAR appraisal) — RVPS-gated launch measurement.
#
# This is the coco-as side of the RVPS accept/reject gate. The Ear token broker
# (attestation_service::ear_token::broker) evaluates default_cpu.rego, reads the
# `trust_claims` rule, and exposes RVPS to the policy as a rego extension function:
# `query_reference_value("<name>")` returns the reference-value list for that name
# (populated from the rvps-reference-values ConfigMap, i.e. `make gen-rvps` /
# Veritas output) or Null when absent — so a missing value fails closed. RVPS has
# NO effect unless the policy calls query_reference_value — the base permissive
# policy never does, so swapping in this one is what turns RVPS on.
#
# INPUT SHAPE (verified against trustee source, transform_claims in broker.rs):
# verifier claims are nested under the TEE name — input.snp.measurement,
# input.snp.policy_debug_allowed — EXCEPT init_data and report_data, which are
# hoisted to the top level (input.init_data). Flat paths like input.measurement
# are silently undefined: every gated rule then stays at its fail-closed default
# (33/97/36) and the token appraisal is Contraindicated even for good evidence.
#
# Same mount caveats as the base (gitops/base/trustee/kbs-configmaps.yaml):
#  - the data key MUST be `default_cpu.rego` (operator subPath-mounts that exact key)
#  - restart the KBS deployment after applying (subPath mounts do not live-update)
apiVersion: v1
kind: ConfigMap
metadata:
  name: attestation-policy
  namespace: trustee-operator-system
data:
  default_cpu.rego: |
    package policy

    import rego.v1

    # AR4SI (RATS EAR) trustworthiness tiers: 2..31 = affirming, 32..95 = warning,
    # 96+ = contraindicated. Defaults are the NON-affirming tier, so every gated
    # claim fails closed: an empty/absent RVPS entry leaves executables at 33 and
    # the resource policy withholds. SNP-specific claim names (input.snp.*) —
    # this file is the cpu/SNP policy only.
    default executables := 33
    default hardware := 97
    default configuration := 36
    default file_system := 2
    default instance_identity := 2
    default runtime_opaque := 2
    default storage_opaque := 2
    default sourced_data := 2

    # THE RVPS GATE: affirm executables only when the SNP launch measurement in the
    # evidence matches one of the Veritas-generated reference values. Same rule as
    # trustee's upstream ear_default_policy_cpu.rego SNP section.
    executables := 3 if {
      input.snp
      input.snp.measurement in query_reference_value("snp_launch_measurement")
    }

    # The SNP report signature + VCEK chain are verified by coco-as BEFORE this
    # policy runs; here we only refuse debug-enabled guest policies.
    hardware := 2 if {
      input.snp
      input.snp.policy_debug_allowed == false
    }

    configuration := 2 if {
      input.snp
      input.snp.policy_debug_allowed == false
      input.snp.policy_migrate_ma == false
    }

    trust_claims := {
      "executables": executables,
      "hardware": hardware,
      "configuration": configuration,
      "file-system": file_system,
      "instance-identity": instance_identity,
      "runtime-opaque": runtime_opaque,
      "storage-opaque": storage_opaque,
      "sourced-data": sourced_data,
    }
