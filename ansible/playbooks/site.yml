---
# site.yml — orchestrates the disconnected SNO air-gapped bring-up in PHASE ORDER, faithfully
# reproducing docs/runbooks/disconnected-sno-bringup.md and scripts/*.sh.
#
# TF/Ansible boundary: Terraform OWNS the infrastructure (bastion, node, VLAN, firewall, netboot
# OS=ipxe). Ansible OWNS the bastion host config + the OpenShift install. `make up` interleaves
# the two (TF apply bastion -> ansible bastion prep -> TF apply node -> ansible discover+install).
# This playbook covers ONLY the Ansible halves; run it after the matching TF apply (see Makefile
# `up` target / ansible/README.md). Tags let you run a single phase: --tags egress,mirror etc.
#
# STOP for SEV-SNP BIOS happens between the bastion-prep phase and the install phase — there is a
# hard pause printing the BIOS recipe. The node must have its SEV-SNP BIOS set (via Latitude IPMI)
# before it netboots, so the install phase is gated behind that confirmation.

# =====================================================================================
# PHASE A — Bastion preparation (egress hardening -> tools -> mirror push -> dns/ntp).
# Run AFTER `terraform apply` of the bastion module, BEFORE the node is provisioned.
# =====================================================================================
- name: "Phase A — bastion preparation (egress, tools, mirror, dns/ntp)"
  hosts: bastions
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
  # Gate the whole phase on the bastion's first-boot mirror bootstrap (#71). `terraform apply`
  # returns as soon as Latitude reports the server `on`, but cloud-init still has to dnf-install
  # packages, pull the ~GB mirror-registry tarball and install quay. mirror_tools consumes
  # {{ mirror_ca_path }} and {{ mirror_password_path }}, which cloud-init writes at the very END
  # of that chain, one line before it stamps MIRROR_READY. Prior cycles never hit this because
  # they reused an already-bootstrapped bastion; it bites every from-zero rebuild.
  # These are pre_tasks, not a role, so they run BEFORE bastion_egress — which otherwise fights
  # cloud-init for the dnf lock and rewrites the default route while the tarball is still in flight.
  pre_tasks:
    - name: Wait for the bastion to accept SSH (fresh cloud-init boot)
      ansible.builtin.wait_for_connection:
        timeout: "{{ bastion_ssh_wait_timeout | default(900) }}"
      tags: [bastion-prep, egress, tools, mirror, dns, dns-ntp]

    - name: Wait for the first-boot mirror bootstrap to settle
      ansible.builtin.shell: |
        set -o pipefail
        if [ -f {{ mirror_root }}/MIRROR_FAILED ]; then echo FAILED
        elif [ -f {{ mirror_root }}/MIRROR_READY ]; then echo READY
        else echo PENDING; fi
      args:
        executable: /bin/bash
      register: mirror_bootstrap_state
      changed_when: false
      retries: "{{ mirror_bootstrap_retries | default(160) }}"
      delay: "{{ mirror_bootstrap_delay | default(15) }}"
      until: mirror_bootstrap_state.stdout != 'PENDING'
      tags: [bastion-prep, egress, tools, mirror, dns, dns-ntp]

    - name: Fail closed if the mirror bootstrap did not succeed
      ansible.builtin.assert:
        that: mirror_bootstrap_state.stdout == 'READY'
        fail_msg: >-
          Bastion mirror bootstrap did not complete: {{ mirror_root }}/MIRROR_FAILED is present
          (or the marker never appeared within
          {{ (mirror_bootstrap_retries | default(160) | int) * (mirror_bootstrap_delay | default(15) | int) }}s).
          cloud-init does NOT re-run on its own — inspect /var/log/mirror-bootstrap.log on the
          bastion, then re-run /usr/local/bin/bootstrap-mirror.sh before retrying this phase.
        success_msg: "mirror bootstrap READY — safe to prep the bastion"
      tags: [bastion-prep, egress, tools, mirror, dns, dns-ntp]
  roles:
    - role: bastion_egress   # fix #1 — drop v6 default, clamp MTU 1400 + SYN MSS 1360. FIRST.
      tags: [egress, bastion-prep]
    - role: mirror_tools     # tools to /usr/local/bin, trust CA, nmstate, merged docker config
      tags: [tools, bastion-prep]
    - role: mirror_push      # fix #2 — oc-mirror v2 push with resume-on-retry
      tags: [mirror, bastion-prep]
    - role: dns_ntp          # fix #10 — cluster dnsmasq records + chrony allow
      tags: [dns, dns-ntp, bastion-prep]

# =====================================================================================
# STOP-GATE — SEV-SNP BIOS. Set this via the Latitude browser IPMI/KVM on the NODE before it
# netboots. (Hands-on; not automatable through the provider.) The install phase below assumes
# this is done.
# =====================================================================================
- name: "STOP — set the SEV-SNP BIOS on the node before continuing"
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  tags: [bios, install]
  tasks:
    - name: Print the SEV-SNP BIOS recipe and pause
      ansible.builtin.pause:
        prompt: |

          ====================================================================
          STOP — SET THE SEV-SNP BIOS ON THE NODE (Latitude IPMI/KVM -> AMI Aptio)
          ====================================================================
          This is the ONE hands-on hardware step. Apply BEFORE the node netboots:

            North Bridge -> SEV-SNP Support           = Enabled   (Auto = OFF — this is the gotcha)
            CPU Config   -> SMEE                        = Enabled
            CPU Config   -> SNP Memory (RMP Table) Coverage = Enabled
            CPU Config   -> SEV-ES ASID Space Limit     = 100
            CPU Config   -> SEV Control                 = Enabled

          The misleading "IOMMU SNP feature not enabled" kernel message is caused by
          SEV-SNP Support = Auto, NOT IOMMU — do not chase IOMMU.

          Re-provisioning resets BIOS to defaults — re-apply this recipe every time.

          Type SNP-SET (then ENTER) once the BIOS is set and saved, to continue to
          discover + install. (Ctrl-C then 'A' to abort.)
      register: bios_ack
      when: not (skip_bios_pause | default(false) | bool)

    # The pause above is NOT a gate on its own (#72): ansible.builtin.pause WARNS AND FALLS
    # THROUGH when stdin is not a TTY, so under nohup / CI / `make bringup-sno-airgapped | tee`
    # — i.e. the "hands-off" path this repo advertises — the one hands-on hardware step was
    # silently skipped and the node netbooted with SEV-SNP off. Nothing downstream noticed: no
    # task in Phase B/C re-checks /dev/sev, so the result was a healthy-looking cluster that
    # simply was not confidential, with the first evidence a rung-0 failure hours later.
    # A typed token, not ENTER, so a stray newline on a half-attached stdin cannot satisfy it.
    - name: Fail closed if the SEV-SNP BIOS gate was not acknowledged
      ansible.builtin.assert:
        that: (bios_ack.user_input | default('') | trim) == 'SNP-SET'
        fail_msg: >-
          SEV-SNP BIOS gate NOT acknowledged — refusing to netboot. This is what a
          non-interactive run looks like (ansible.builtin.pause cannot prompt without a TTY);
          re-run this phase from a real terminal. If the BIOS is already set and rung-0 has
          been verified green on this node, pass -e skip_bios_pause=true to proceed
          deliberately. Never skip it merely to get past this message: the install will
          succeed and the cluster will not be confidential.
        success_msg: "SEV-SNP BIOS acknowledged — proceeding to discover + install"
      when: not (skip_bios_pause | default(false) | bool)

# =====================================================================================
# PHASE B — Discover node MACs from the Latitude API (fix #4). Run AFTER `terraform apply`
# of the node module (the server must exist). Rewrites group_vars/discovered.yml.
# =====================================================================================
- name: "Phase B — discover node interface MACs (Latitude API)"
  ansible.builtin.import_playbook: discover.yml
  tags: [discover, install]

# =====================================================================================
# PHASE C — Render configs -> serve boot artifacts -> reinstall+wait. Runs on the bastion.
# discovered.yml (from Phase B) overrides the machines list, so parent_mac is now populated.
# =====================================================================================
- name: "Phase C — render configs, serve boot artifacts, drive the install"
  hosts: bastions
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
  pre_tasks:
    # Load the discovered MACs if discover.yml has run (optional so syntax-check/dry runs work).
    - name: Load discovered MACs (overrides the machines list)
      ansible.builtin.include_vars: "{{ playbook_dir }}/../group_vars/discovered.yml"
      when: (playbook_dir ~ '/../group_vars/discovered.yml') is exists
      tags: [render, install, always]
  roles:
    - role: render_configs   # fix #3 — install-config + agent-config (additionalNTPSources in agent)
      tags: [render, install]
    - role: pxe_serve        # fix #8 — build pxe-files, tokenized nginx serve, verify 206
      tags: [pxe, install]
    - role: install_drive    # fix #5 + #9 — reinstall netboot, wait-for, poll clusterversion
      tags: [drive, install]
    - role: public_console   # default-on public sslip.io console edge; opt out with public_console_enabled=false
      tags: [console, public-console, install]

# =====================================================================================
# After install: close the boot-artifact endpoint (run explicitly: --tags pxe-stop, or the
# Makefile `pxe-stop` target). The secret-bearing initrd must not stay public (issue #33).
# =====================================================================================
- name: "Post-install — close the boot-artifact endpoint"
  hosts: bastions
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
  tags: [pxe-stop, never]
  roles:
    - role: pxe_serve
      vars:
        pxe_mode: stop
