---
# Prepare supplied private-network infrastructure, then explicitly install and verify.
# Complete docs/amd-firmware-preflight.md before acknowledging the BIOS gate.

# Validate the controller's release inputs before any selected preparation/install writes.
# Cleanup stays available even when the BOM is unresolved. Verify mode reads cluster state only.
- name: Validate the selected release before preparation or installation
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  tags: [bastion-prep, tools, mirror, dns, dns-ntp, isolation, render, pxe, drive, install, api-resolver]
  tasks:
    - name: Require the supported provider and private network
      ansible.builtin.assert:
        that:
          - infra_provider == 'cherry'
          - network_profile == 'private-vlan'
        fail_msg: "Only supplied Cherry rigs on private-vlan are supported."

    - name: Validate the effective Ansible release and profile inputs
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../../scripts/verify-release.py"
          - --manifest
          - "{{ release_manifest_absolute }}"
          - --tee
          - "{{ tee }}"
      environment:
        OCP_VERSION: "{{ ocp_version }}"
        OCP_RELEASE_IMAGE: "{{ ocp_release_image }}"
        IMAGESET_CONFIG: "{{ imageset_config_absolute }}"
      changed_when: false

    - name: Require resolved catalog and artifact identities
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../../scripts/verify-release.py"
          - --manifest
          - "{{ release_manifest_absolute }}"
          - --tee
          - "{{ tee }}"
          - --require-resolved
      environment:
        OCP_VERSION: "{{ ocp_version }}"
        OCP_RELEASE_IMAGE: "{{ ocp_release_image }}"
        IMAGESET_CONFIG: "{{ imageset_config_absolute }}"
      changed_when: false
      when: (install_mode | default('fresh')) != 'verify'

# =====================================================================================
# PHASE A — Bastion preparation (tools -> mirror push -> dns/ntp).
# Start with an allocated helper whose mirror bootstrap has completed.
# =====================================================================================
- name: "Phase A — bastion preparation (tools, mirror, dns/ntp)"
  hosts: bastions
  # A new server can be reported as running before SSH accepts connections.
  # Automatic setup runs before pre_tasks, so gather only after the wait below.
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  # Wait for SSH and the protected mirror readiness marker before using registry inputs.
  pre_tasks:
    - name: Wait for the bastion to accept SSH (fresh cloud-init boot)
      ansible.builtin.wait_for_connection:
        timeout: "{{ bastion_ssh_wait_timeout | default(900) }}"
      tags: [bastion-prep, tools, mirror, dns, dns-ntp]

    - name: Gather bastion facts after SSH is ready
      ansible.builtin.setup:
      tags: [bastion-prep, tools, mirror, dns, dns-ntp]

    - name: Wait for the first-boot mirror bootstrap to settle
      ansible.builtin.shell: |
        set -o pipefail
        if [ -f {{ mirror_root }}/MIRROR_FAILED ]; then echo FAILED
        elif [ -f {{ mirror_root }}/MIRROR_READY ]; then echo READY
        else echo PENDING; fi
      args:
        executable: /bin/bash
      # Bootstrap protects /opt/mirror with mode 0700; the SSH login cannot
      # distinguish an inaccessible READY marker from one that is absent.
      become: true
      register: mirror_bootstrap_state
      changed_when: false
      retries: "{{ mirror_bootstrap_retries | default(160) }}"
      delay: "{{ mirror_bootstrap_delay | default(15) }}"
      until: mirror_bootstrap_state.stdout != 'PENDING'
      tags: [bastion-prep, tools, mirror, dns, dns-ntp]

    - name: Fail closed if the mirror bootstrap did not succeed
      ansible.builtin.assert:
        that: mirror_bootstrap_state.stdout == 'READY'
        fail_msg: >-
          Bastion mirror bootstrap did not complete: {{ mirror_root }}/MIRROR_FAILED is present
          (or the marker never appeared within
          {{ (mirror_bootstrap_retries | default(160) | int) * (mirror_bootstrap_delay | default(15) | int) }}s).
          cloud-init does NOT re-run on its own — inspect /var/log/mirror-bootstrap.log on the
          bastion, then re-run /usr/local/bin/bootstrap-mirror.sh before retrying this phase.
        success_msg: "mirror bootstrap READY — safe to prep the bastion"
      tags: [bastion-prep, tools, mirror, dns, dns-ntp]
  roles:
    - role: mirror_tools     # tools to /usr/local/bin, trust CA, nmstate, merged docker config
      tags: [tools, bastion-prep]
    - role: mirror_push      # fix #2 — oc-mirror v2 push with resume-on-retry
      tags: [mirror, bastion-prep]
    - role: dns_ntp          # fix #10 — cluster dnsmasq records + chrony allow
      tags: [dns, dns-ntp, bastion-prep]
    - role: bastion_isolation
      tags: [isolation, bastion-prep]
      when: bastion_node_isolation_enabled | default(false) | bool

# =====================================================================================
# STOP-GATE — acknowledge evidence for this node before its destructive reinstall.
# Firmware menu locations and security-fix versions depend on the board and BIOS.
# =====================================================================================
- name: "STOP — verify AMD firmware and SNP prerequisites before continuing"
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  tags: [bios, install]
  tasks:
    - name: Print the AMD firmware preflight requirements and pause
      ansible.builtin.pause:
        prompt: |

          ====================================================================
          STOP — VERIFY THIS NODE'S AMD FIRMWARE AND SNP PREREQUISITES
          ====================================================================
          Follow docs/amd-firmware-preflight.md before the node is reinstalled:

            1. Match server ID, CPU, motherboard, BIOS and BMC to the actual node.
            2. Verify saved firmware settings using this board's documentation.
               Assess firmware security fixes separately from SNP functionality.
            3. Verify UEFI boot mode and the intended UEFI installer boot path.
            4. Pass scripts/host-snp-check.sh on this node after the saved settings
               take effect; retain the command result and relevant kernel logs.

          An unloaded module, pending BIOS changes or CPU feature flags are not a pass.
          Missing RMP controls and IOMMU errors require board-specific diagnosis.
          Recheck after reprovisioning; do not assume firmware settings were preserved.

          docs/amd-firmware-preflight.md records the tested H13 settings and their limits.
          It is not a universal H12/H13 BIOS configuration or a current security baseline.

          Type SNP-SET (then ENTER) only after completing this preflight, to continue
          to discover + install. This token records acknowledgement, not an automated
          hardware or attestation result. (Ctrl-C then 'A' to abort.)
      register: bios_ack
      when: not (skip_bios_pause | default(false) | bool)

    # The pause above is NOT a gate on its own (#72): ansible.builtin.pause WARNS AND FALLS
    # THROUGH when stdin is not a TTY, so under nohup / CI / `make bringup-sno-airgapped | tee`
    # — i.e. the "hands-off" path this repo advertises — the one hands-on hardware step was
    # silently skipped and the node netbooted with SEV-SNP off. Nothing downstream noticed: no
    # task in Phase B/C re-checks /dev/sev, so the result was a healthy-looking cluster that
    # simply was not confidential, with the first evidence a rung-0 failure hours later.
    # A typed token, not ENTER, so a stray newline on a half-attached stdin cannot satisfy it.
    - name: Fail closed if the SEV-SNP BIOS gate was not acknowledged
      ansible.builtin.assert:
        that: (bios_ack.user_input | default('') | trim) == 'SNP-SET'
        fail_msg: >-
          AMD firmware preflight NOT acknowledged — refusing to netboot. This is what a
          non-interactive run looks like (ansible.builtin.pause cannot prompt without a TTY);
          re-run this phase from a real terminal. Only after recording this node's identity,
          firmware security review, UEFI boot path and successful raw-host SNP check under
          docs/amd-firmware-preflight.md may an unattended rerun deliberately use
          -e skip_bios_pause=true. The bypass does not perform or establish these checks.
        success_msg: "AMD firmware preflight acknowledged — proceeding to discover + install"
      when: not (skip_bios_pause | default(false) | bool)

# =====================================================================================
# PHASE B — Verify allocated Cherry identity and NICs through pinned SSH.
# Save only current MAC bindings in external state.
# =====================================================================================
- name: "Phase B — discover Cherry node interface MACs"
  ansible.builtin.import_playbook: discover.yml
  tags: [discover, install]

# =====================================================================================
# PHASE C — Render configs -> serve boot artifacts -> reinstall+wait. Runs on the bastion.
# Validated MAC bindings from Phase B fill missing MACs in the current machine inputs.
# =====================================================================================
- name: "Phase C — render configs, serve boot artifacts, drive the install"
  hosts: bastions
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
  pre_tasks:
    # Run on the controller, where COCO_STATE_DIR and discovery evidence live.
    # A separate output variable also supports `-e machines=...`: Ansible extra
    # vars cannot be overridden by set_fact, and current install inputs must win.
    - name: Validate cached identities and merge MACs into current machine inputs
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../../scripts/discover-node-macs.py"
          - merge
        stdin: "{{ {'machines': machines} | to_json }}"
      delegate_to: localhost
      become: false
      register: discovery_merge
      changed_when: false
      tags: [render, install]

    - name: Use the validated machine inputs for rendering
      ansible.builtin.set_fact:
        discovery_machines: "{{ discovery_merge.stdout | from_json }}"
      tags: [render, install]
  roles:
    - role: render_configs   # fix #3 — install-config + agent-config (additionalNTPSources in agent)
      tags: [render, install]
    - role: pxe_serve        # fix #8 — build pxe-files, tokenized nginx serve, verify 206
      tags: [pxe, install]
    - role: install_drive    # fix #5 + #9 — reinstall netboot, wait-for, poll clusterversion
      tags: [drive, install]
    - role: public_console   # default-on public sslip.io console edge; opt out with public_console_enabled=false
      tags: [console, public-console, install]

# =====================================================================================
# After install: close the boot-artifact endpoint (run explicitly: --tags pxe-stop, or the
# Makefile `pxe-stop` target). The secret-bearing initrd must not stay public (issue #33).
# =====================================================================================
- name: "Post-install — close the boot-artifact endpoint"
  hosts: bastions
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
  tags: [pxe-stop, never]
  roles:
    - role: pxe_serve
      vars:
        pxe_mode: stop
