---
# Direct role/tag invocations are read-only unless fresh installation is selected explicitly.
install_mode: verify
install_trigger_reinstall: "{{ install_mode == 'fresh' }}"
reinstall_existing: false
# Set only after inspecting an ambiguous previous provider request and confirming it was not accepted.
retry_reinstall: false

# Raw-provider SSH is separate from core@RHCOS and from the public key embedded
# in install-config. These explicit controller paths must remain outside the repo.
private_link_known_hosts: ""
raw_node_ssh_user: ""
raw_node_ssh_key: ""
private_link_probe_timeout: 3

# wait-for install-complete timeout (minutes). A bootstrap-complete timeout is treated as
# NON-fatal (fix #9) — we fall through to polling clusterversion.
install_wait_timeout_min: 90

# clusterversion poll: total attempts * delay should comfortably exceed a slow SNO install.
clusterversion_poll_retries: 60
clusterversion_poll_delay: 60
