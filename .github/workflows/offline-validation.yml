# Offline checks for every pull request and every push to main. They need no
# cluster, credentials or AMD hardware; `make lint` runs the same checks
# locally. Only the capability tests on SEV-SNP hardware show that attestation
# works (docs/capability-status.md).
name: offline-validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validation:
    # scripts/lint.sh: shell, policy, manifest, Ansible and doc-link checks and
    # the unit tests. Linux runs Python 3.12, the oldest supported controller, and
    # 3.14, the newest the pinned ansible-core supports. macOS runs every script
    # under the Bash 3.2 that macOS ships, as a workstation would.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.12'
    name: validation (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install the development tools
        shell: bash
        run: |
          python -m pip install -r requirements-dev.txt
          if [ "$RUNNER_OS" = macOS ]; then brew install shellcheck; else sudo apt-get update && sudo apt-get install -y shellcheck; fi
          python scripts/install-dev-tools.py
          echo "$HOME/.local/state/openshift-confidential-containers/dev-bin" >> "$GITHUB_PATH"
      - name: Use the Bash that ships with macOS
        # /bin/bash is 3.2. First on PATH, it runs the scripts and the tests that
        # call them, whatever newer Bash the runner image also has.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/macos-bash"
          ln -sf /bin/bash "$RUNNER_TEMP/macos-bash/bash"
          echo "$RUNNER_TEMP/macos-bash" >> "$GITHUB_PATH"
      - name: Run the offline checks
        shell: bash
        run: |
          bash --version | head -n 1
          bash scripts/lint.sh
  terraform:
    # Offline: formats, validates and tests infra/cherry with a mocked provider.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Check the Cherry Servers Terraform
        run: |
          terraform -chdir=infra/cherry fmt -check -recursive -diff
          terraform -chdir=infra/cherry init -backend=false -input=false
          terraform -chdir=infra/cherry validate
          terraform -chdir=infra/cherry test
      - name: Check the lock file covers every controller platform
        # init adds the h1 checksum of any platform the lock file lacks,
        # which leaves a contributor's checkout modified.
        run: |
          terraform -chdir=infra/cherry providers lock \
            -platform=linux_amd64 -platform=linux_arm64 \
            -platform=darwin_amd64 -platform=darwin_arm64 -platform=windows_amd64
          git diff --exit-code -- infra/cherry/.terraform.lock.hcl
  diagrams:
    # GitHub renders Mermaid blocks in Markdown; a syntax error shows as a broken diagram.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Render every Mermaid diagram
        run: python3 scripts/check-mermaid.py
