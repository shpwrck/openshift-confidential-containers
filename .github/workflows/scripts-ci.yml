name: offline-validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python and shell dependencies
        shell: bash
        run: |
          python -m pip install -r requirements-dev.txt
          if [ "$RUNNER_OS" = macOS ]; then brew install shellcheck; else sudo apt-get update && sudo apt-get install -y shellcheck; fi
          python scripts/install-dev-tools.py
          echo "$HOME/.local/state/openshift-confidential-containers/dev-bin" >> "$GITHUB_PATH"
      - name: Check workstation Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do /bin/bash -n "$file"; done < <(find scripts -type f -name '*.sh')
          /bin/bash -n ansible/up.sh
      - name: Run required offline checks
        shell: bash
        run: bash scripts/lint.sh
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.7'
      - name: Format and validate without provider credentials
        run: |
          terraform fmt -check -recursive infra
          for module in infra/latitude/bastion infra/latitude; do
            terraform -chdir="$module" init -backend=false -input=false
            terraform -chdir="$module" validate
          done
