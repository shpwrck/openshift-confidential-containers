# Monthly update PRs for the CI actions, the pinned Python development tools and the
# Cherry Servers Terraform provider.
# Product versions live in install/release-manifest.json and change only through
# docs/release-resolution.md, so they are not managed here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-tools:
        patterns: ["*"]
  - package-ecosystem: terraform
    directory: /infra/cherry
    schedule:
      interval: monthly
