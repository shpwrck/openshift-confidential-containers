apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Operator subscriptions + namespaces. Install order: NFD -> cert-manager -> OSC -> Trustee.
# Subscriptions point `source` at the oc-mirror CatalogSource in openshift-marketplace; see
# README.md. Populate from onboarding guide Gates 2-4 + Step 3.
resources:
  - operatorhub-disable-defaults.yaml   # disconnected: kill broken default catalogs (#57), else OLM can't resolve any sub
  - namespaces.yaml
  - operatorgroups.yaml
  - subscriptions.yaml

# ArgoCD sync-wave (#75): this tree mixes operator Subscriptions with CRs of the CRDs those
# operators install, so an unordered apply races and fails "no matches for kind". Waves order
# the ARGOCD path (the customer env). The rig's `oc apply -k` has no such ordering — use
# scripts/apply-sno.sh, which stages the applies explicitly.
# wave 0: Subscriptions/OperatorGroups — install the operators that OWN the CRDs below
commonAnnotations:
  argocd.argoproj.io/sync-wave: "0"
