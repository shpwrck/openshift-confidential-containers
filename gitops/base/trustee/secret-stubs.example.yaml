# Trustee 1.2 input inventory — documentation only, never secret values.
#
# Restricted customer profile:
#   kbs-https-cert: kubernetes.io/tls, tls.crt/tls.key, serving identity including
#     the actual KBS endpoint SAN. Provision and rotate outside this repository.
#   kbs-token-cert: kubernetes.io/tls, tls.crt/tls.key, attestation-token signer
#     and verification trust. It is distinct from image signing and the mirror CA.
#   VCEK Secrets: one vcek.der per approved HWID, stable short Secret name from
#     collect-vcek.sh; full lowercase HWID appears only in the mounted path.
#   Workload resource Secrets: explicit KBS_RESOURCE_NAMES; each key is served at
#     kbs:///default/<secret-name>/<key>. Preserve names/bytes during migration.
#
# scripts/seed-trustee-secrets.sh is for disposable Permissive labs only:
#   credential/test and regcred/config: registry auth JSON
#   registry-configuration/test: guest registry remapping
#   security-policy/test: deliberately permissive lab image policy
#   security-policy/rung-signed: optional signature policy
#   sig-public-key/rung-signed: optional workload-image signing PUBLIC key
#   attestation-status/status and sample/secret: synthetic gate/demo values
#   attestation-cert/attestation.crt: legacy released public certificate resource
#
# It merges supplied data keys without deleting omitted signed-policy keys.
# Customer seeding is out of band; do not seed synthetic defaults over customer
# material. Private keys, authfiles, passwords and generated secret manifests must
# remain outside Homelab. The Operator owns its generated admin/TLS copies.
