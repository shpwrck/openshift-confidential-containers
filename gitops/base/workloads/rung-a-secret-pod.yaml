---
# Synthetic secret-gate example; apply-rung-kbs.sh renders current environment inputs.
# CDH is guest-local. A successful resource fetch gates application startup.
# Keep pod memory above guest RAM plus runtime overhead; retain the memory-guard label.
apiVersion: v1
kind: Pod
metadata:
  name: rung-a-secret
  namespace: default  # FILL: confidential workload namespace.
  labels:
    # Required selector for the Gatekeeper memory guard.
    coco-resource-default: "true"
  annotations:
    # CVM RAM for the guest. Keep the pod memory limit >= this + 256Mi (QEMU overhead).
    io.katacontainers.config.hypervisor.default_memory: "2048"  # MiB. FILL per workload.
    # Workload scripts supply environment-bound initdata, for example:
    # io.katacontainers.config.hypervisor.cc_init_data: <gzip+base64 TOML>   # FILL per overlay.
spec:
  runtimeClassName: kata-cc  # CoCo runtime; handler resolves to kata-snp on SEV-SNP.
  restartPolicy: Never
  initContainers:
    # Gate start on a successful attestation: ask the in-CVM CDH for the attestation status.
    - name: attestation-gate
      image: registry.access.redhat.com/ubi9/ubi-minimal@sha256:eba570d04193d1523a8576b1c0ff00e681c9edb1a41d4742559b6e3ff457601e
      command:
        - /bin/sh
        - -c
        - |
          set -e
          # CDH resource API, loopback inside the CVM. A non-success body / non-200 fails the
          # init container, so the workload only runs once the secret was released.
          curl -fsS -o /dev/null http://127.0.0.1:8006/cdh/resource/default/attestation-status/status
          echo "attestation: ok"
  containers:
    - name: app
      image: registry.access.redhat.com/ubi9/ubi-minimal@sha256:eba570d04193d1523a8576b1c0ff00e681c9edb1a41d4742559b6e3ff457601e
      command: ["/bin/sh", "-c", "echo 'rung-a: confidential workload running'; sleep 3600"]
      resources:
        limits:
          # MUST be >= default_memory annotation (2048Mi) + 256Mi overhead. See note above.
          memory: "2304Mi"  # FILL: keep in sync with default_memory.
        requests:
          memory: "2304Mi"
