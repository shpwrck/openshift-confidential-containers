apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Demo workloads per rung. Only rung-kbs is applied by default; the signed and encrypted rungs
# need generated image artifacts and environment-bound initdata, so scripts/apply-rung-signed.sh
# and scripts/apply-rung-encrypted.sh render/apply them.
# initdata is environment-bound (HOST_DATA) — kept per-overlay or generated by scripts, not here.
resources:
  - rung-a-secret-pod.yaml

# ArgoCD sync-wave (#75): this tree mixes operator Subscriptions with CRs of the CRDs those
# operators install, so an unordered apply races and fails "no matches for kind". Waves order
# the ARGOCD path (the customer env). The rig's `oc apply -k` has no such ordering — use
# scripts/apply-sno.sh, which stages the applies explicitly.
# wave 6: Workloads last — they need kata-cc RuntimeClass (wave 2) and the memory guard (wave 3)
commonAnnotations:
  argocd.argoproj.io/sync-wave: "6"
