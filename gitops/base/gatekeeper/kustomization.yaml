apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Gatekeeper operator + (after CSV) a Gatekeeper CR with mutation enabled and the CoCo
# memory-resource Assign mutation. CR + Assign are added once the CRDs exist (verified live).
resources:
  - operator.yaml
  - gatekeeper-cr.yaml      # apply after the operator CSV is Succeeded (registers mutations CRDs)
  - assign-coco-mem.yaml    # apply after the Gatekeeper CR is up (Assign CRD must exist)
  - constraint-coco-mem.yaml  # ConstraintTemplate+Constraint; apply Constraint AFTER its template CRD exists

# ArgoCD sync-wave (#75): this tree mixes operator Subscriptions with CRs of the CRDs those
# operators install, so an unordered apply races and fails "no matches for kind". Waves order
# the ARGOCD path (the customer env). The rig's `oc apply -k` has no such ordering — use
# scripts/apply-sno.sh, which stages the applies explicitly.
# wave 3: Gatekeeper CR + Assign + ConstraintTemplate/Constraint — need the Gatekeeper CRDs from wave 0
commonAnnotations:
  argocd.argoproj.io/sync-wave: "3"
