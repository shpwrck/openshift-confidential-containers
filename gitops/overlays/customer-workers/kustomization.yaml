apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Customer multi-node confidential workers (air-gapped). Driven by mirrored ArgoCD.
resources:
  - ../../base/operators
  - ../../base/kataconfig
  - ../../base/workloads
# Hardware discovery alone does not authorize a runtime rollout to every SNP node.
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: trustee-operator-system
  - patch: |-
      $patch: delete
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: trustee-operator-group
        namespace: trustee-operator-system
  - patch: |-
      $patch: delete
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: trustee-operator
        namespace: trustee-operator-system
  - target:
      kind: KataConfig
      name: cluster-kataconfig
    patch: |-
      - op: replace
        path: /spec/kataConfigPoolSelector
        value:
          matchLabels:
            amd.feature.node.kubernetes.io/snp: "true"
            node-role.kubernetes.io/coco-snp: ""
  - target:
      kind: Pod
    patch: |-
      - op: add
        path: /spec/nodeSelector
        value:
          amd.feature.node.kubernetes.io/snp: "true"
          node-role.kubernetes.io/coco-snp: ""
# Configure mirror rewrites and external Trustee initdata before customer use.
