apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# This is the separate Trustee server, so it also uses Restricted + HTTPS.
# The Operator creates its route. Set site-specific certificates out of band.
# Co-located disposable testing uses the script's explicit Permissive profile:
# TRUSTEE_PROFILE=Permissive TRUSTEE_LAB=1 scripts/apply-trustee.sh configure
resources:
  - ../../base/trustee
